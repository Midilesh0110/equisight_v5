name: Equisight V5 Live Engine

on:
  schedule:
    # Runs at 12:30 UTC (6:00 PM IST) Monday to Friday
    - cron: '30 12 * * 1-5'
  workflow_dispatch:   # allows manual run from GitHub UI

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EquiSight Production Engine
        run: python main.py

      # Pin third-party git-auto-commit-action to an immutable commit SHA
      - name: Commit Execution State & CSV Metrics
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 System: Synchronize DB and Daily CSV Metrics"
          file_pattern: 'database/equisight_v5.db *.csv'